name: weather-demo

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-weather_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-weather_demo}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-weather_owner} -d ${POSTGRES_DB:-weather_demo}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    # Bound to localhost only — this is a local/demo convenience for `psql`/GUI clients, not a
    # public port. The only public surfaces are the api/web services (added in later features),
    # which connect over the compose network, not this host mapping. Host port is configurable
    # (default 55432) so it doesn't collide with a Postgres already running on the default 5432.
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432'

  # One-shot: applies migrations, roles/grants, and the starter seed, then exits (see
  # docker/migrate-entrypoint.sh). Everything that depends on schema being present waits on this
  # service completing successfully, never on `postgres` alone.
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL_OWNER: postgresql://${POSTGRES_USER:-weather_owner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-weather_demo}
      WEATHER_INGEST_PASSWORD: ${WEATHER_INGEST_PASSWORD:?WEATHER_INGEST_PASSWORD is required, see .env.example}
      WEATHER_API_PASSWORD: ${WEATHER_API_PASSWORD:?WEATHER_API_PASSWORD is required, see .env.example}

  # Long-running: fetches Open-Meteo data on a schedule using the weather_ingest role only
  # (SELECT everywhere, INSERT/UPDATE only on the tables it populates — see packages/db/roles.sql).
  ingest:
    build:
      context: .
      dockerfile: docker/Dockerfile.ingest
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL_INGEST: postgresql://weather_ingest:${WEATHER_INGEST_PASSWORD}@postgres:5432/${POSTGRES_DB:-weather_demo}

  # Public, read-only JSON API using the weather_api role only (SELECT everywhere, no write grant
  # exists for it at all — see packages/db/roles.sql). Published directly too (not just via the
  # web service's proxy) so `curl localhost:3000/api/...` and /api/docs work standalone.
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL_API: postgresql://weather_api:${WEATHER_API_PASSWORD}@postgres:5432/${POSTGRES_DB:-weather_demo}
      PORT: '3000'
    ports:
      - '${API_HOST_PORT:-3000}:3000'

  # The public-facing surface: static SPA served by nginx, which also reverse-proxies /api/* to
  # the api service (docker/nginx.conf) so the browser only ever calls same-origin relative paths.
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_started
    ports:
      - '${WEB_HOST_PORT:-8080}:8080'

volumes:
  postgres-data:
