server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: any path that isn't a real file falls through to index.html; react-router owns routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxied to the api service inside the compose network — the browser only ever
    # calls same-origin relative /api/* paths, so no CORS or baked-in API URL is needed.
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
