name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Not real credentials — scoped to the ephemeral postgres service container for this job only.
  DATABASE_URL_OWNER: postgresql://weather_owner:ci-owner-password@localhost:5432/weather_demo
  TEST_DATABASE_URL: postgresql://weather_owner:ci-owner-password@localhost:5432/weather_demo
  WEATHER_INGEST_PASSWORD: ci-ingest-password
  WEATHER_API_PASSWORD: ci-api-password

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: weather_owner
          POSTGRES_PASSWORD: ci-owner-password
          POSTGRES_DB: weather_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weather_owner -d weather_demo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Generates packages/db/src/generated/prisma — typecheck and every test below import from
      # it, so this has to run before either. Needs no live database (see prisma.config.ts).
      - name: Generate Prisma Client
        run: npm run db:generate

      # Fast, no-database checks first (constitution Development Workflow: fail fast before the
      # slower live-database steps).
      - name: Lint (enforces the 600-line file-size ceiling, spec SC-005)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Agent skill harness check
        run: npm run harness:check

      # packages/db/src/{migrate,apply-roles,seed}.test.ts exercise these same operations against
      # TEST_DATABASE_URL, but the suite doesn't provision a fresh database on its own — apply
      # migrations/roles/seed against the service container first so both the tests and the
      # smoke check below have real schema and data to work with. `npm test` below also covers
      # packages/ingest and packages/api's suites automatically (vitest.config.ts globs every
      # workspace package), including the assertion that no API route accepts a data-mutating
      # method (spec 002 FR-007/SC-003).
      - name: Apply database migrations
        run: npm run db:migrate

      - name: Apply database roles and grants
        run: npm run db:roles

      - name: Seed starter data
        run: npm run db:seed

      - name: Unit tests
        run: npm test

      - name: Schema smoke check
        run: npm run db:smoke

  e2e:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Real docker-compose stack, not a mocked backend — matches how this project verifies
      # itself throughout (specs/002's ingest worker also hits the live Open-Meteo API). Accepted
      # tradeoff: e2e depends on Open-Meteo's uptime; it's a stable, free public API with no
      # rate limit relevant at this project's scale (a dozen cities, hourly).
      - name: Start the full stack
        run: |
          cp .env.example .env
          docker compose up --build -d

      - name: Wait for the web service to respond
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/ && exit 0
            sleep 2
          done
          echo "web service never became ready" >&2
          docker compose logs
          exit 1

      - name: Wait for ingested data (first cycle) before testing
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/meta/freshness | grep -q '"lastSuccessfulRunAt":"20' && exit 0
            sleep 2
          done
          echo "no successful ingest run within timeout" >&2
          docker compose logs ingest
          exit 1

      - name: Run Playwright e2e tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose logs

      - name: Tear down the stack
        if: always()
        run: docker compose down -v
