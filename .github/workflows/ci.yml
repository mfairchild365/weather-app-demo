name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Not real credentials — scoped to the ephemeral postgres service container for this job only.
  DATABASE_URL_OWNER: postgresql://weather_owner:ci-owner-password@localhost:5432/weather_demo
  TEST_DATABASE_URL: postgresql://weather_owner:ci-owner-password@localhost:5432/weather_demo
  WEATHER_INGEST_PASSWORD: ci-ingest-password
  WEATHER_API_PASSWORD: ci-api-password

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: weather_owner
          POSTGRES_PASSWORD: ci-owner-password
          POSTGRES_DB: weather_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weather_owner -d weather_demo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fast, no-database checks first (constitution Development Workflow: fail fast before the
      # slower live-database steps).
      - name: Lint (enforces the 600-line file-size ceiling, spec SC-005)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      # packages/db/src/{migrate,apply-roles,seed}.test.ts exercise these same operations against
      # TEST_DATABASE_URL, but the suite doesn't provision a fresh database on its own — apply
      # migrations/roles/seed against the service container first so both the tests and the
      # smoke check below have real schema and data to work with.
      - name: Apply database migrations
        run: npm run db:migrate

      - name: Apply database roles and grants
        run: npm run db:roles

      - name: Seed starter data
        run: npm run db:seed

      - name: Unit tests
        run: npm test

      - name: Schema smoke check
        run: npm run db:smoke
